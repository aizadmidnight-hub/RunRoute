<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Navigasi Laluan Larian</title>

  <!-- Memuatkan Leaflet terus dari repositori GitHub anda sendiri -->
  <link rel="stylesheet" href="leaflet.css" />

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body, html { height: 100%; width: 100%; overflow: hidden; }
    #map { height: 100vh; width: 100vw; z-index: 1; background: #cbd5e1; }

    .status-panel {
      position: fixed; top: 12px; left: 12px; right: 12px; z-index: 1000;
      background: #1e293b; color: #fff; padding: 14px 16px; border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3); transition: background 0.3s ease;
    }
    .status-panel.safe { background: #15803d; }
    .status-panel.danger { background: #dc2626; animation: pulse 1s infinite; }
    .status-title { font-size: 16px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
    .status-sub { font-size: 13px; opacity: 0.9; margin-top: 4px; }

    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.02); }
      100% { transform: scale(1); }
    }

    .control-panel {
      position: fixed; bottom: 20px; left: 12px; right: 12px; z-index: 1000;
      display: flex; gap: 8px; flex-wrap: wrap; justify-content: center;
    }
    button {
      border: none; padding: 12px 16px; border-radius: 10px; font-weight: 600;
      font-size: 14px; cursor: pointer; box-shadow: 0 3px 10px rgba(0,0,0,0.2);
    }
    .btn-start { background: #2563eb; color: white; flex: 1; }
    .btn-center { background: #ffffff; color: #0f172a; }
    .btn-sim { background: #f59e0b; color: #0f172a; font-size: 12px; }

    .runner-dot {
      width: 18px; height: 18px; background: #2563eb; border: 3px solid #ffffff;
      border-radius: 50%; box-shadow: 0 0 12px rgba(37, 99, 235, 0.9);
    }
  </style>
</head>
<body>

  <div id="statusPanel" class="status-panel">
    <div class="status-title" id="statusTitle">📍 Sedia untuk Mula</div>
    <div class="status-sub" id="statusSub">Tekan "Mula Navigasi" untuk aktifkan GPS & suara.</div>
  </div>

  <div id="map"></div>

  <div class="control-panel">
    <button class="btn-start" id="btnStart" onclick="startNavigation()">▶ Mula Navigasi</button>
    <button class="btn-center" onclick="centerOnUser()">🎯 Lokasi Saya</button>
    <button class="btn-sim" onclick="simulateOffRoute()">🧪 Uji Keluar Laluan</button>
  </div>

  <!-- Memuatkan Leaflet JS terus dari repositori GitHub anda -->
  <script src="leaflet.js"></script>

  <script>
    // ==========================================
    // 1. DATA LALUAN GEOJSON ANDA
    // ==========================================
    const raceRouteGeoJSON = {
      "type": "FeatureCollection",
      "features": [
        {
          "type": "Feature",
          "properties": {},
          "geometry": {
            "type": "LineString",
            "coordinates": [
              [100.7312301, 4.8181648],
              [100.7298861, 4.8176768],
              [100.7297302, 4.8177162],
              [100.7298598, 4.818016],
              [100.7316188, 4.818644],
              [100.7315249, 4.8188843],
              [100.7322048, 4.8191573],
              [100.7325735, 4.8187022],
              [100.7312746, 4.8181798],
              [100.7336086, 4.8193089]
            ]
          }
        }
      ]
    };

    const MAX_OFF_ROUTE_METERS = 25;
    let map, userMarker, routeCoords = [];
    let userCoords = null, autoFollow = true;
    let lastAlertTime = 0, wakeLock = null;

    // ==========================================
    // 2. INISIALISASI PETA
    // ==========================================
    function initMap() {
      if (typeof L === 'undefined') {
        updateStatus("danger", "⚠️ Fail leaflet.js Tiada", "Pastikan fail leaflet.js & leaflet.css dimuat naik ke folder GitHub yang sama.");
        return;
      }

      map = L.map('map', { zoomControl: false }).setView([4.8185, 100.7315], 17);

      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19,
        attribution: '© OpenStreetMap'
      }).addTo(map);

      const routeLayer = L.geoJSON(raceRouteGeoJSON, {
        style: { color: '#2563eb', weight: 7, opacity: 0.85 }
      }).addTo(map);

      // Ekstrak koordinat garisan
      const lineFeature = raceRouteGeoJSON.features.find(
        f => f.geometry && f.geometry.type === "LineString"
      );

      if (lineFeature) {
        routeCoords = lineFeature.geometry.coordinates;
        const startPt = routeCoords.at(0);
        const endPt = routeCoords.at(-1);

        L.circleMarker([startPt.at(1), startPt.at(0)], {
          radius: 9, color: '#ffffff', weight: 3, fillColor: '#16a34a', fillOpacity: 1
        }).addTo(map).bindPopup("<b>🏁 Garisan Mula</b>");

        L.circleMarker([endPt.at(1), endPt.at(0)], {
          radius: 9, color: '#ffffff', weight: 3, fillColor: '#dc2626', fillOpacity: 1
        }).addTo(map).bindPopup("<b>🏆 Garisan Tamat</b>");
      }

      if (routeLayer.getBounds().isValid()) {
        map.fitBounds(routeLayer.getBounds());
      }

      map.on('dragstart', () => { autoFollow = false; });
    }

    // ==========================================
    // 3. PENGIRAAN JARAK TERDEKAT KE GARISAN (TERBINA DALAM)
    // ==========================================
    function getDistanceFromRouteMeters(lat, lng) {
      if (routeCoords.length < 2) return 0;
      let minDistance = Infinity;

      for (let i = 0; i < routeCoords.length - 1; i++) {
        const p1 = routeCoords.at(i);
        const p2 = routeCoords.at(i + 1);
        const dist = pointToSegmentDistance(lat, lng, p1.at(1), p1.at(0), p2.at(1), p2.at(0));
        if (dist < minDistance) minDistance = dist;
      }
      return Math.round(minDistance);
    }

    function pointToSegmentDistance(lat, lng, lat1, lng1, lat2, lng2) {
      const R = 6371000;
      const toRad = x => x * Math.PI / 180;
      const y = toRad(lat - lat1) * R;
      const x = toRad(lng - lng1) * R * Math.cos(toRad(lat1));
      const y2 = toRad(lat2 - lat1) * R;
      const x2 = toRad(lng2 - lng1) * R * Math.cos(toRad(lat1));

      const lenSq = x2 * x2 + y2 * y2;
      let param = lenSq !== 0 ? (x * x2 + y * y2) / lenSq : -1;
      param = Math.max(0, Math.min(1, param));

      const xx = param * x2;
      const yy = param * y2;
      return Math.sqrt((x - xx) * (x - xx) + (y - yy) * (y - yy));
    }

    // ==========================================
    // 4. MULA NAVIGASI & GPS REAL-TIME
    // ==========================================
    async function startNavigation() {
      if (!("geolocation" in navigator)) {
        alert("Pelayar web anda tidak menyokong GPS.");
        return;
      }

      document.getElementById('btnStart').innerText = "🟢 Navigasi Aktif";
      speak("Navigasi larian dimulakan. Sila ikut garisan biru di atas peta.");

      try {
        if ('wakeLock' in navigator) {
          wakeLock = await navigator.wakeLock.request('screen');
        }
      } catch (err) {}

      navigator.geolocation.watchPosition(
        (position) => {
          updateRunnerPosition(
            position.coords.latitude,
            position.coords.longitude,
            Math.round(position.coords.accuracy)
          );
        },
        () => {
          updateStatus("danger", "⚠️ Ralat GPS", "Sila pastikan GPS / Location telefon diaktifkan.");
        },
        { enableHighAccuracy: true, maximumAge: 1000, timeout: 10000 }
      );
    }

    function updateRunnerPosition(lat, lng, accuracy = 10) {
      userCoords = [lat, lng];

      if (!userMarker) {
        const icon = L.divIcon({
          className: 'runner-dot',
          iconSize: L.point(18, 18),
          iconAnchor: L.point(9, 9)
        });
        userMarker = L.marker(userCoords, { icon: icon }).addTo(map);
      } else {
        userMarker.setLatLng(userCoords);
      }

      if (autoFollow) map.setView(userCoords, 18);

      const distanceMeters = getDistanceFromRouteMeters(lat, lng);

      if (distanceMeters > MAX_OFF_ROUTE_METERS) {
        updateStatus(
          "danger",
          "🚨 AMARAN: ANDA TERSALAH LALUAN!",
          `Anda berada ${distanceMeters} meter dari laluan rasmi. Sila patah balik!`
        );
        triggerOffRouteAlert();
      } else {
        updateStatus(
          "safe",
          "✅ Di Atas Laluan Rasmi",
          `Jarak dari garisan: ${distanceMeters}m • Ketepatan GPS: ±${accuracy}m`
        );
      }
    }

    function triggerOffRouteAlert() {
      const now = Date.now();
      if (now - lastAlertTime > 8000) {
        lastAlertTime = now;
        if (navigator.vibrate) navigator.vibrate(500);
        speak("Amaran! Anda telah terkeluar dari laluan larian. Sila patah balik ke garisan biru.");
      }
    }

    function speak(text) {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'ms-MY';
        utterance.rate = 1.05;
        window.speechSynthesis.speak(utterance);
      }
    }

    function updateStatus(type, title, sub) {
      const panel = document.getElementById('statusPanel');
      panel.className = `status-panel ${type}`;
      document.getElementById('statusTitle').innerText = title;
      document.getElementById('statusSub').innerText = sub;
    }

    function centerOnUser() {
      autoFollow = true;
      if (userCoords) map.setView(userCoords, 18);
    }

    function simulateOffRoute() {
      autoFollow = true;
      updateRunnerPosition(4.8210, 100.7340, 5);
    }

    initMap();
  </script>
</body>
</html>
